<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L3o Study · Admin</title><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Inter,system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,calc(100% - 32px));padding:30px;border:1px solid #26314a;border-radius:26px;background:#111827;box-shadow:0 30px 80px #0008}h1{margin-top:0}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#06b6d4);font-weight:900}.field{margin:14px 0}.field label{display:block;color:#9aa8c2;font-size:13px;margin-bottom:7px}.field input{box-sizing:border-box;width:100%;padding:13px;border-radius:12px;border:1px solid #2a3550;background:#0b1120;color:white}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:800}.err{color:#fda4af;margin-top:12px}</style></head><body><div class="box"><div class="logo">L</div><h1>L3o Study Admin</h1><p style="color:#9aa8c2">Private control center.</p><form id="f"><div class="field"><label>Username</label><input id="u" autocomplete="username"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div><button class="btn">Sign in</button><div id="e" class="err"></div></form></div><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location='/admin';else document.querySelector('#e').textContent=(await r.json()).detail||'Login failed'};</script></body></html>
