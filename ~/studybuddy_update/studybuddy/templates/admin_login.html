<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Study Buddy</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#1B1F2A; font-family:'IBM Plex Mono', monospace; color:#F5F1E8;
  }
  .login-box{
    background:#262B3A; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:32px;
    width:100%; max-width:340px; opacity:0; transform: translateY(12px);
    animation: boxIn .5s cubic-bezier(.2,.85,.3,1) forwards;
  }
  @keyframes boxIn{ to{ opacity:1; transform:translateY(0); } }
  h1{ font-family:'Fraunces', serif; font-size:20px; margin:0 0 20px; text-align:center; }
  input{
    width:100%; padding:12px; border-radius:6px; border:1px solid rgba(255,255,255,0.14);
    background:#1B1F2A; color:#F5F1E8; font-family:'IBM Plex Mono', monospace; font-size:13px;
    box-sizing:border-box; margin-bottom:14px; transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{ outline:none; border-color:#E8A33D; box-shadow: 0 0 0 3px rgba(232,163,61,0.15); }
  button{
    width:100%; padding:12px; border:none; border-radius:6px; background:#E8A33D; color:#1B1F2A;
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px; cursor:pointer;
    transition: transform .12s ease, background .12s ease;
  }
  button:hover{ background:#f0b558; transform: translateY(-1px); }
  .error{ background:rgba(220,90,80,0.12); border:1px solid rgba(220,90,80,0.3); color:#F4A8A0;
    padding:10px 12px; border-radius:6px; font-size:12px; margin-bottom:14px; }
</style>
</head>
<body>
  <div class="login-box">
    <h1>Admin Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Admin password" autofocus required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
